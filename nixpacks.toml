# Railway/Nixpacks config for Piyukonek Flask app

[variables]
    # Pinipilit nito ang Mise na gumamit ng stable version
    PYTHON_VERSION = "3.11"

[phases.setup]
    # Tinatanggal natin ang nixPkgs para Mise ang mag-handle nang malinis
    # O kung gusto mo ng Nix, siguraduhing "python311" lang talaga
    nixPkgs = ["python311"]

[phases.install]
    cmds = ["pip install -r requirements.txt"]

[start]
    cmd = "gunicorn -b 0.0.0.0:${PORT:-5000} piyukonek.app:app"
