[phases.setup]
    nixPkgs = ["python311"]

[phases.install]
    cmds = ["python -m venv /opt/venv && /opt/venv/bin/pip install -r requirements.txt"]

[start]
    cmd = "/opt/venv/bin/gunicorn -b 0.0.0.0:${PORT:-5000} piyukonek.app:app"

[variables]
    NIXPACKS_PYTHON_LOADER = "nix"
    PYTHON_VERSION = "3.11"
